server:
  port: ${PORT:8080}
  servlet:
    context-path: /api

spring:
  application:
    name: fundamentos01
  jpa:
    properties:
      hibernate:
        "[format_sql]": true
        dialect: org.hibernate.dialect.PostgreSQLDialect

# ============== CONFIGURACIÓN DE JWT ==============
# Los valores propios de cada ambiente (secret, expiration, issuer) se
# definen en application-dev.yml / application-prod.yml, nunca aquí.
jwt:
  header: Authorization
  prefix: "Bearer "

# ============== CONFIGURACIÓN DE MONITOREO ==============
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics