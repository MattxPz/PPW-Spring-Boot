databases:
  - name: pwp67-db
    databaseName: pwp67_db
    user: pwp67_user
    plan: free

services:
  - type: web
    name: pwp67-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DB_HOST
        fromDatabase:
          name: pwp67-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: pwp67-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: pwp67-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: pwp67-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: pwp67-db
          property: password
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRATION
        value: 3600000
      - key: JWT_REFRESH_EXPIRATION
        value: 604800000
      - key: JWT_ISSUER
        value: pwp67-api