services:
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped

    environment:
      POSTGRES_DB: pwp67_db
      POSTGRES_USER: pwp67_user
      POSTGRES_PASSWORD: pwp67_password

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pwp67_user -d pwp67_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile

    restart: unless-stopped

    depends_on:
      postgres:
        condition: service_healthy

    ports:
      - "8080:8080"

    environment:
      SPRING_PROFILES_ACTIVE: prod

      DATABASE_URL: jdbc:postgresql://postgres:5432/pwp67_db
      DB_USERNAME: pwp67_user
      DB_PASSWORD: pwp67_password

      JWT_SECRET: mySecretKeyForJWT2024MustBeAtLeast256BitsLongForHS256Algorithm
      JWT_EXPIRATION: 3600000

volumes:
  postgres_data: